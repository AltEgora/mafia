# Расширенный набор ролей и три ИИ-агента вместо ботов.
# Агентам нужен бесплатный ключ OpenRouter в переменной окружения
# OPENROUTER_API_KEY; без него они играют как обычные боты. Флаг --ai-agents K важнее поля count.
roles:
  mafia: auto
  ninja: 1
  commissar: 1
  doctor: 1
  maniac: 1
  journalist: 1
  bodyguard: 1
ai_agents:
  count: 3
  # model: google/gemma-4-31b-it:free   # необязательно; по умолчанию — бесплатная
  #                                     # Nemotron 3 Super с запасными моделями
  # Характеры агентов: каждому агенту — случайный, в партии разные, пока их
  # хватает. Слышны в тоне реплик, но не меняют правила игры. Без этого списка
  # (например, только с флагом --ai-agents) у всех агентов нейтральный характер.
  characteristics:
    - "плохо врёт и часто выдаёт себя волнением"
    - "никому не доверяет и подозревает всех понемногу"
    - "осторожный: говорит мало и голосует вместе с большинством"
    - "логик: опирается на голосования и раскрытые роли"
    - "эмоциональный: быстро обвиняет того, кто обвинил его"
    - "лидер: уверенно называет, против кого голосовать, и убеждает остальных"
    - "миротворец: заступается за тех, кого обвиняют без доказательств"
    - "упрямый: выбрав подозреваемого, держится за него до конца"
    - "наблюдатель: замечает, кто резко меняет мнение или отмалчивается"
    - "шутник: говорит с иронией, но голосует всерьёз"
