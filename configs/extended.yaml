# Расширенный набор: по одной дополнительной роли из каждой группы.
# Порядок особых ролей — приоритет, если на всех не хватит мест.
roles:
  mafia: auto      # вместе с ниндзя: floor(N/3), но не меньше 1
  ninja: 1         # мафиози, которого проверка комиссара видит мирным
  commissar: 1
  doctor: 1
  maniac: 1
  journalist: 1    # сравнивает двух игроков: одинаковый ли у них статус
  bodyguard: 1     # прикрывает игрока и отвечает выстрелом нападавшему
